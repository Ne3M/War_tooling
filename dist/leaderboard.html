<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leaderboard Matchmaking report</title>

    

    <style>
    body {
      font-family: sans-serif;
      font-size: 0.825rem;
      padding: 1rem;

      display: flex;
      gap: 2rem;
      align-items: start;
    }

.fieldset {
  margin: 0 0 1rem;
  flex-grow: 1;
  position: sticky;
  top: .5rem;
}
fieldset {
  border: none;
  padding: 0;
  margin: 0 0 1rem;
}

label {
  display: block;
  margin-bottom: 0.5rem;
}

textarea {
  width: 100%;
  height: 100px;
  box-sizing: border-box;
}

table {
   border-collapse: collapse;
  border: 2px solid #666;
  position: relative;
}
thead {
  font-weight: bold;
}
td, th {
  border: 1px #999 solid;
  padding: 0.375rem 0.5rem;
}
th {
  background: #999;
  border-color: #fff;
  position: sticky;
  top: 0;
}
th:first-child {
  text-align: left;
}
tr:nth-child(10n+1) td {
  border-bottom: 4px black solid;
}
.outOfLeaderBoard {
  /*border: 2px red solid;*/
  background: #fec
}
.outOfLeaderBoard .alliance {
  color: orangered;
  /*font-weight:bold;*/
}
.fumicon {
  background:lime
}
.bold {
  font-weight:bold;
color: red
}
.player {
  background: #eee;
  font-weight: bold;
}
.inactive {
  opacity:0.5;
  font-style:italic;
}
.diesel, .deployed, .power {
  text-align:right
}

.hidden {
  display: none;
}

#getdata {
  display: none;
}

.HTTP_Headers {
  display: flex;
  flex-wrap: wrap;
  gap: 0.5rem;
  div {
    width: calc(33% - 0.5rem);
  }
  input {
    width: 100%;
    box-sizing: border-box;
  }
  label {
    margin-bottom: 0.25rem;
    white-space: nowrap;
  }
  .instructions {
    display: none;
  }

  &:has(input:placeholder-shown) .instructions {
    color: rgb(206, 72, 54);
    display: block;
    width: 100%;
  }
  & + .get_ratings_paster {
    display: none;
  }
  &:has(input:placeholder-shown) + .get_ratings_paster {
    display: block;
  }
}

.loader {
  display: none;
  border: 4px solid #f3f3f3; /* Light grey */
  border-top: 4px solid #3498db; /* Blue */
  border-radius: 50%;
  width: 24px;
  height: 24px;
  animation: spin 1s ease-in-out infinite;
  &.visible {
    display: inline-block;
  }
}
@keyframes spin {
  0% { transform: rotate(0deg); }
  100% { transform: rotate(360deg); }
}

</style>
</head>
<body>

    <div class="result"></div>

    <div class="fieldset">

      <fieldset class="HTTP_Headers">
        <div><label for="version">PNK-Version</label> <input type="text" id="version" placeholder=" "></input></div>
        <div><label for="player_id">PNK-Player-ID</label> <input type="text" id="player_id" placeholder=" "></input></div>
        <div><label for="session_id">PNK-Session-ID</label> <input type="text" id="session_id" placeholder=" "></input></div>
        <div class="instructions">
          Your connection data are out of date, please follow the instructions below to update them : <br>
          - Copy / Paste the request headers from your browser's network tab (F12) into the textarea below. <br>
          - If you use the browser extension, close this page, go back to your game and click on the leaderboard button

        </div>
      </fieldset>

      <fieldset class="get_ratings_paster">
        <label for="data">Paste here the get_ratings request response</label>
        <textarea id="data" placeholder="Paste here the get_ratings request response"></textarea>
        <button id="getdata">Copy DATA to clipboard</button>  
      </fieldset>

      <fieldset class="call_to_action">
        <select id="sort_by">
          <option value="POWER">Sort by Power</option>
          <option value="MAX_POWER">Sort by Max Power</option>
          <option value="MIN_POWER">Sort by Min Power</option>
        </select>
        <button id="updateLeaderBoard">Update Leaderboard</button>  
      </fieldset>

      <fieldset class="status">
        <div class="loader"></div>
      </fieldset>

    </div>
    


    <script>

        let SORT_BY = "POWER" // "POWER" || "MAX_POWER" || "MIN_POWER"

        const process = (data, log=false) => {

            log && console.log({currentData, data})
            if( !currentData.result.guilds ) {
                log && console.log('First set of data')
                currentData = JSON.parse(JSON.stringify(data))
            } else if ( data.result.guilds ) {
                log && console.log('Merge ranking', currentData.result.guilds.length, data.result.guilds.length)
                currentData.result.guilds.forEach(g => { g.place = "100+"})
                currentData.result.guilds = [...currentData.result.guilds, ...data.result.guilds]
                log && console.log('Merge ranking', currentData.result.guilds.length, data.result.guilds.length)
            }

             if( data.error?.code === 11007) {
                log && console.log(data.error.message)
                const guildID = data.error.message.split(' ')[1]
                const index = currentData.result.guilds.findIndex(g => g.id == guildID)
                if (index !== -1) {
                    currentData.result.guilds.splice(index,1)
                }
            }
            if( data.result.members ) {
                log && console.log('Add single guild', data.result.guild.name)
                log && console.log(data.result.guild)
                currentData.result.guilds.push(data.result.guild)
            }

            // Dedupe
            log && console.log('Number of ally before : ', currentData.result.guilds || 0)
            if(currentData.result.guilds != null) {
              currentData.result.guilds = [...currentData.result.guilds.reverse().filter((g,i) => i === currentData.result.guilds.indexOf(currentData.result.guilds.find(z => z.id === g.id))) ]
            }
            log && console.log('Number of ally after : ', currentData.result.guilds || 0)
        }

        const updateResult = () => {
          const storeData = []
          let html = `<table>
              <tr>
                    <th colspan="8" class='ranking_time'>${new Date().toLocaleString({ dateStyle: 'short', timeStyle: 'short' })}</th>
                  </tr>
              <tr>
                <th class=''>Map</th>
                <th class=''>Alliance</th>
                <th class='member'>Members</th>
                <th class='power'> Power</th>
                <th class='maxpower'> Max Power</th>
                <th class='minpower'> Min Power</th>
                <th class='rank'> Rank</th>
                <th class='rank'> ID</th>
              </tr>
          `
          currentData.result.guilds

            

              // Sort by max power
              .sort((a, b) => {

                  switch (SORT_BY) {
                    case "POWER":
                      let aCurrentPower = Math.max(a.summary_power, a.max_summary_power * 0.85)
                      let bCurrentPower = Math.max(b.summary_power, b.max_summary_power * 0.85)
                      return aCurrentPower - bCurrentPower; 
                      break;
                    
                    case "MAX_POWER":
                      return a.max_summary_power - b.max_summary_power;

                    case "MIN_POWER":
                      return a.max_summary_power * 0.85 - b.max_summary_power * 0.85;

                  
                  }

                  
              })
              .reverse()
              .forEach((g, i) => {

              storeData.push({
                name: g.name,
                members_count: g.members_count || g.current_members || g.guild_current_members, 
                summary_power : g.summary_power,
                max_summary_power: g.max_summary_power, 
                place: g.place,
                id: g.id
              })

              html += `<tr class='${g.name.includes("FuMiCon")||g.name.includes("TaintKickerz")?"fumicon":""} ${(g.place==="100+" || g.place>100)?"outOfLeaderBoard":""}'>
              <td>${ Math.floor( i / 10 ) +1 }</td>
              <td class='alliance'>${g.name}</td> 
              <td class='member'> ${(g.members_count || g.current_members || g.guild_current_members || 0).toLocaleString('en-US')}</td>
              <td class='power ${g.summary_power > g.max_summary_power * 0.85 ? "bold": ""}'> ${g.summary_power.toLocaleString('en-US')}</td>
              <td class='maxpower'> ${g.max_summary_power.toLocaleString('en-US')}</td>
              <td class='minpower ${g.summary_power < g.max_summary_power * 0.85 ? "bold": ""}'>${ Math.round(g.max_summary_power * 0.85).toLocaleString('en-US')}</td>
              <td class='rank'>${g.place}</td> 
              <td class='id'>${g.id}</td> 
              </tr>`
          })
          html += "</table>"
          // console.log(JSON.stringify(storeData).length)
          localStorage.setItem('storeData', JSON.stringify({result:{guilds: storeData}}))
          storedData = localStorage.getItem('storeData')
          document.querySelector('.result').innerHTML = html
        }

        const processHeaders = (data) => {
          const headers = {}
          headersList = data.split(`\n`)
          for(header of headersList) {
            const [key, value] = [...header.split(':')]
            if(!value) continue 
            headers[key] = value
          }

          setNewHeaders(headers['PNK-Player-ID'], headers['PNK-Session-Id'], headers['PNK-Version'])

          document.querySelector('#data').value = ""
          console.log({loginID, sessionID, deviceID, appVersion})
        }

        const getAllianceById = async (id = 61) => {
          //console.log('WANNA FETCH ALLIANCE ID : ', id);

          const url = 'https://ga.chickgoddess.com/gs_api/guilds/get_members';
          const options = {
            method: 'POST',
            headers: {
              'pnk-device-id': deviceID,
              'pnk-env': 'WebGLPlayer',
              'pnk-login-id': loginID,
              'pnk-version': appVersion,
              'pnk-platform': 'NUTAKU',
              'pnk-request-client-start-time': new Date().toISOString(),
              'pnk-session-id': sessionID,
              'content-type': 'application/json'
            },
            body: `{"guild_id": ${id},"members":true,"recruits":false,"requests":false,"invites":false}`
          };

          try {
            const response = await fetch(url, options);
            const data = await response.json();
            return data
          } catch (error) {
          }
        }

        const getLeaderboard = async (id = 61) => {
          const url = 'https://ga.chickgoddess.com/gs_api/guild_wars/get_ratings';
          const options = {
            method: 'POST',
            headers: {
              'pnk-device-id': deviceID,
              'pnk-env': 'WebGLPlayer',
              'pnk-login-id': loginID,
              'pnk-version': appVersion,
              'pnk-platform': 'NUTAKU',
              'pnk-request-client-start-time': new Date().toISOString(),
              'pnk-session-id': sessionID,
              'content-type': 'application/json'
            },
            body: `{"limit":100}`
          };

          try {
            const response = await fetch(url, options);
            const data = await response.json();
            if(data.error.code) {
              throw new Error(data.error.title);
            }
            return data
          } catch (error) {
            console.error('Error fetching leaderboard:', error);
            handleInvalidHeaders();
            return null;
          }
        }

        const setNewHeaders = (_loginID, _sessionID, _appVersion) => {
          loginID = _loginID;
          sessionID = _sessionID;
          appVersion = _appVersion;

          sessionStorage.setItem('loginID', _loginID)
          sessionStorage.setItem('sessionID', _sessionID)
          sessionStorage.setItem('appVersion', _appVersion)

          document.querySelector('#player_id').value = _loginID
          document.querySelector('#session_id').value = _sessionID
          document.querySelector('#version').value = _appVersion

          console.log({loginID, sessionID, deviceID, appVersion})
        }

        const handleInvalidHeaders = () => {
          loginID = null;
          sessionID = null;
          appVersion = null;
          sessionStorage.removeItem('loginID');
          sessionStorage.removeItem('sessionID');
          sessionStorage.removeItem('appVersion');
          document.querySelector('#player_id').value = ""
          document.querySelector('#session_id').value = ""
          document.querySelector('#version').value = ""

          console.log({loginID, sessionID, deviceID, appVersion})
        }

        const updateTop500 = async () => {

          console.log('update TOP 500')
          const promises = []
          TOP_500_ALLIANCE.forEach((g) => {
              promises.push(getAllianceById(g) )
          })
          await Promise.all(promises).then((values) => {
            values.forEach(v =>  { 
              process(v)
            })
            updateResult()
          });
        }

        const autoFetch = async (e) => {

          document.querySelector('.loader').classList.add('visible')

          // console.log(currentData.result.guilds)
          const leaderboard = await getLeaderboard()
          if(leaderboard == null) {
            document.querySelector('.loader').classList.remove('visible')
            return;
          }
          // console.log(leaderboard)

          currentData.result.guilds?.forEach(g => { g.place = "100+"})
          process(leaderboard)

          if(currentData.result.guilds.length === 100) {
            await updateTop500();
          } else {
            const promises = []
            currentData.result.guilds.forEach((g, i) => {
              if(g.place === "100+") {
                promises.push(getAllianceById(g.id))
              }
            })
            // console.log(promises)
            await Promise.all(promises).then((values) => {
              values.forEach((v) =>  { 
                document.querySelector('.loader').classList.remove('visible')
                process(v)
              })
              updateResult()
            });
          }

          window.dispatchEvent(new CustomEvent('leaderboardUpdated'));

        }

        let currentData = { result:{ guilds: []} };

        let loginID = sessionStorage.getItem('loginID')
        let sessionID = sessionStorage.getItem('sessionID')
        let deviceID = 'ea156bc8-1359-13c6-ae1c-a12fe5a9f3e0' // Constant device ID for all users
        let appVersion = sessionStorage.getItem('appVersion')

        const urlParams = new URLSearchParams(window.location.search);
        if(urlParams.has('PNK-Player-ID') && urlParams.has('PNK-Session-Id') && urlParams.has('PNK-Version')) {
          loginID = urlParams.get('PNK-Player-ID')
          sessionID = urlParams.get('PNK-Session-Id')
          appVersion = urlParams.get('PNK-Version')
          sessionStorage.setItem('loginID', loginID)
          sessionStorage.setItem('sessionID', sessionID)
          sessionStorage.setItem('appVersion', appVersion)
        }
        document.querySelector('#player_id').value = loginID
        document.querySelector('#session_id').value = sessionID
        document.querySelector('#version').value = appVersion
        console.log({loginID, sessionID, deviceID, appVersion})

        let storedData = localStorage.getItem('storeData')
        document.querySelector('#sort_by').value = "POWER"

        if(storedData) {
          process(JSON.parse(storedData))
          updateResult()
        }

        document.querySelector('#getdata').addEventListener("click", async (e) => {
          navigator.clipboard.writeText(JSON.stringify(currentData));
        })

        document.querySelector('#updateLeaderBoard').addEventListener("click", async (e) => {
          autoFetch()
        })

        document.addEventListener("paste", async (e) => {
          setTimeout(() => {
              data = document.querySelector("#data").value

              try {
                process(JSON.parse(data), true)
              } catch (error) {
                processHeaders(data)
                autoFetch()
              }
          }, 0)
        })

        document.querySelector('#sort_by').addEventListener('change', e => {
          SORT_BY = e.target.value
          process(JSON.parse(storedData))
        })

        document.querySelectorAll('#version, #player_id, #session_id').forEach(input => {
          input.addEventListener('input', e => {
            const _loginID = document.querySelector('#player_id').value
            const _sessionID = document.querySelector('#session_id').value
            const _appVersion = document.querySelector('#version').value
            setNewHeaders(_loginID, _sessionID, _appVersion)
          })
        })
    </script>
</body>
</html>
