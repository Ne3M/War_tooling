# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Leaderboard CI

on:
  workflow_dispatch: # Bouton "Run workflow" dans GitHub
  schedule:
    # 1. Toutes les 12h (Ex: 02h00 et 14h00 heure française -> 00h00 et 12h00 UTC)
    - cron: '0 0,12 * * *'

    # 2. Toutes les heures entre Dimanche 20h00 et Lundi 21h00 (Heure de Paris)
    # Dimanche 20h-23h Paris -> Dimanche 18h-21h UTC
    - cron: '0 18-21 * * 0'
    # Lundi 00h-21h Paris -> Dimanche 22h-23h UTC + Lundi 00h-19h UTC
    - cron: '0 22-23 * * 0'
    - cron: '0 0-19 * * 1'

    # 3. Toutes les 5 minutes le Lundi entre 19h30 et 21h00 (Heure de Paris)
    # Lundi 19h30-19h55 Paris -> Lundi 17h30-17h55 UTC
    - cron: '30/5 17 * * 1'
    # Lundi 20h00-20h55 Paris -> Lundi 18h00-18h55 UTC
    - cron: '*/5 18 * * 1'
    # Lundi 21h00 Paris -> Lundi 19h00 UTC
    - cron: '0 19 * * 1'
    
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 24
        cache: 'npm'
        
    - name: Installer les dépendances npm
      run: npm ci

    - name: Installer les navigateurs Playwright
      run: npx playwright install chromium --with-deps
      
    - name: Executer un script de test
      run: npm run hello

    - name: Exécuter Playwright
      run: npm run playwright:test

    - name: Commiter et pousser les résultats
      run: |
        git config --global user.name 'leaderboard[bot]'
        git config --global user.email 'leaderboard[bot]@users.noreply.github.com'
        git add dist/data/
        git commit -m "chore: mise à jour automatique des données" || exit 0
        git push