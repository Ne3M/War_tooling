# This workflow will do a clean installation of node dependencies, cache/restore them, build the source code and run tests across different versions of node
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Leaderboard CI

on:
  workflow_dispatch: # Bouton "Run workflow" dans GitHub
  schedule:
    - cron: '0 */2 * * *' # Exécution automatique toutes les 2 heures (pile)
    
jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Récupérer le code
      uses: actions/checkout@v4

    - name: Configurer Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        
    - name: Installer les dépendances npm
      run: npm ci

    - name: Installer les navigateurs Playwright
      run: npx playwright install --with-deps
      
    - name: Exécuter Playwright
      env:
        MY_APP_USER: ${{ secrets.APP_USERNAME }}
        MY_APP_PASS: ${{ secrets.APP_PASSWORD }}
      run: npm run hello
